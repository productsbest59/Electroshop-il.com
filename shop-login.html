d'));if(!await isAdmin(session)){signOut();throw new Error('החשבון אינו מוגדר כמנהל החנות')}location.href='shop-admin.html'}catch(error){message.textContent=error.message==='Invalid login credentials'?'כתובת המייל או הסיסמה אינם נכונים':error.message;message.className='status show error'}});</script><div class="a11y-backdrop" id="a11yBackdrop"></div>
