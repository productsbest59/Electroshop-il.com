name: Build and publish Electroshop

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

# Generated HTML and sitemap exist only in the build, never in a bot commit.
permissions:
  contents: read

concurrency:
  group: electroshop-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Apply shared icons and social banner
        run: node tools/apply-brand-metadata.mjs
      - name: Generate current articles, news and sitemap
        run: node tools/generate-sitemap.mjs
      - name: Generate category buying guides
        run: node tools/generate-category-guides.mjs
      - name: Verify category guides and privacy disclosures
        run: node tools/test-category-privacy.mjs
      - name: Verify article canonicals and sitemap
        run: node tools/test-article-pages.mjs
      - name: Verify related article links and live refresh
        run: node tools/test-related-articles.mjs
      - name: Verify prebuilt news list and live-refresh fallback
        run: node tools/test-news-page.mjs
      - name: Verify conflict-free publishing
        run: node tools/test-publishing-workflow.mjs
      # Retain the same Jekyll processing as the previous branch-based Pages site.
      - name: Build Pages output
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload tested site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site without changing main
        id: deployment
        uses: actions/deploy-pages@v4
