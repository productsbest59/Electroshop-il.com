name: Update sitemap

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'tools/generate-sitemap.mjs'
      - 'tools/apply-brand-metadata.mjs'
      - 'tools/generate-article-pages.mjs'
      - 'tools/generate-news-page.mjs'
      - 'tools/test-news-page.mjs'
      - 'tools/test-related-articles.mjs'
      - 'shop-article*.js'
      - 'shop-news.js'
      - 'shop-news-render.js'
      - 'shop-category-guides.js'
      - 'tools/generate-category-guides.mjs'
      - 'tools/test-category-privacy.mjs'
      - 'shop-image-alt.js'

permissions:
  contents: write

concurrency:
  group: electroshop-sitemap
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply shared icons and social banner to current and future pages
        run: node tools/apply-brand-metadata.mjs
      - name: Generate sitemap from site and database
        run: node tools/generate-sitemap.mjs
      - name: Generate category buying guides
        run: node tools/generate-category-guides.mjs
      - name: Verify category guides and privacy disclosures
        run: node tools/test-category-privacy.mjs
      - name: Verify article canonicals and sitemap
        run: node tools/test-article-pages.mjs
      - name: Verify related article links and live refresh
        run: node tools/test-related-articles.mjs
      - name: Verify prebuilt news list and live-refresh fallback
        run: node tools/test-news-page.mjs
      - name: Publish sitemap changes
        run: |
          git add sitemap.xml '*.html' shop-article-pages.json
          if git diff --cached --quiet; then
            echo "Sitemap is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update sitemap automatically"
          git push
