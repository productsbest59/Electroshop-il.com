<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניהול חדשות ומדריכים | אלקטרושופ</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="shop-base.css"><link rel="stylesheet" href="shop-components.css"><link rel="stylesheet" href="shop-header.css"><link rel="stylesheet" href="shop-articles-admin.css?v=4"></head><body><header class="electroshop-header product-admin-header"><a class="electroshop-header-brand" href="index.html"><img src="images/logo.png" alt="אלקטרושופ" width="86" height="86"><span><strong>אלקטרושופ</strong><span>ניהול תוכן</span></span></a><nav class="electroshop-header-links"><a href="shop-admin.html">ניהול מוצרים</a><a href="shop-news.html" target="_blank">תצוגת חדשות ומדריכים</a></nav></header><main class="articles-admin"><div class="articles-admin-head"><div><h1>ניהול חדשות ומדריכים</h1><p>כתיבת כתבות, שמירת טיוטות ופרסום באתר</p></div><button id="newArticle" class="button" type="button">+ כתבה חדשה</button></div><div id="pageStatus" role="status"></div><div class="articles-admin-layout"><aside class="articles-admin-list"><h2>הכתבות שלי</h2><div id="articleList"></div></aside><section class="article-editor-card"><form id="articleForm"><input name="id" type="hidden"><input name="cover_path" type="hidden"><div class="article-form-grid"><label>כתובת הכתבה באנגלית<input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="sim-vs-esim"><small>אותיות קטנות באנגלית ומקפים בלבד</small></label><label>מצב<select name="status"><option value="draft">טיוטה - לא מוצגת באתר</option><option value="published">מפורסמת באתר</option></select></label><label>כותרת בעברית<input name="title_he" required></label><label>כותרת באנגלית<input name="title_en"></label><label>תקציר בעברית<textarea name="excerpt_he" rows="3"></textarea></label><label>תקציר באנגלית<textarea name="excerpt_en" rows="3"></textarea></label><label>כותרת SEO בעברית<input name="seo_title_he" maxlength="70"></label><label>כותרת SEO באנגלית<input name="seo_title_en" maxlength="70"></label><label>תיאור SEO בעברית<textarea name="seo_description_he" maxlength="170" rows="2"></textarea></label><label>תיאור SEO באנגלית<textarea name="seo_description_en" maxlength="170" rows="2"></textarea></label><label>טקסט חלופי לתמונה בעברית<input name="cover_alt_he"></label><label>טקסט חלופי לתמונה באנגלית<input name="cover_alt_en"></label><label class="full">תמונה ראשית<input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><img id="coverPreview" class="cover-preview" hidden alt="תצוגה מקדימה"></label><div class="full editor-language"><h2>תוכן בעברית</h2><div class="article-toolbar" data-for="content_he"></div><div class="article-rich-editor" data-editor="content_he" contenteditable="true" dir="rtl"></div><textarea name="content_he" hidden></textarea></div><div class="full editor-language"><h2>Content in English</h2><div class="article-toolbar" data-for="content_en"></div><div class="article-rich-editor" data-editor="content_en" contenteditable="true" dir="ltr"></div><textarea name="content_en" hidden></textarea></div></div><div class="article-actions"><button class="button" type="submit">שמירה</button><button id="previewArticle" class="button secondary" type="button">תצוגה מקדימה</button><button id="deleteArticle" class="button danger" type="button">מחיקת הכתבה</button><span id="formStatus" class="status" role="status"></span></div></form></section></div></main><script type="module" src="shop-articles-admin.js?v=10"></script></body></html>
